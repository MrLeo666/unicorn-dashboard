name: Update unicorn data

on:
  schedule:
    - cron: '0 8 * * 1'   # every Monday 08:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade pip && pip install -r scripts/requirements.txt

      - name: Scrape Wikipedia
        run: python scripts/scrape_wikipedia.py

      # Computes pending.json (diffs vs current unicorns.json + overrides). Does NOT
      # touch unicorns.json — the dashboard stays frozen until the user reviews & approves
      # the changes in admin.html.
      - name: Compute pending updates
        run: python scripts/compute_pending.py

      # Forge Global secondary-market overlay. Reads forge_slugs.json + unicorns.json
      # and writes data/forge_data.json. Top 100 by valuation.
      - name: Scrape Forge Global (Top 100)
        continue-on-error: true
        run: python scripts/scrape_forge.py

      # Notice Weekly Update email — secondary-market quotes from notifications@notice.co
      # 需要在 GitHub Secrets 配置:
      #   GMAIL_CLIENT_ID / GMAIL_CLIENT_SECRET / GMAIL_REFRESH_TOKEN
      # 见 scripts/scrape_notice_email.py 顶部注释获取 refresh_token 的步骤。
      - name: Scrape Notice Weekly Update (email)
        continue-on-error: true
        env:
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python scripts/scrape_notice_email.py

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/wiki_raw.json data/pending.json data/forge_data.json data/notice_secondary.json
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
          else
            git commit -m "data: weekly Wikipedia + Forge + Notice refresh"
            git push
          fi
